<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pet Picker Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Press Start 2P', monospace;
      padding: 24px;
    }

    /* ── Modal shell ── */
    .modal {
      background: #12111f;
      border: 3px solid #d06878;
      box-shadow: 6px 6px 0 rgba(0,0,0,0.5);
      padding: 1.5rem 1.25rem;
      width: 100%;
      max-width: 500px;
    }

    .modal h3 {
      font-size: 1rem;
      color: #d06878;
      text-align: center;
      letter-spacing: 0.05em;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.4);
      margin-bottom: 0.75rem;
    }

    /* ── 3×2 pet grid ── */
    .pet-picker {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.6rem;
      margin: 0.75rem 0 0.5rem;
    }

    .pet-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      padding: 0.65rem 0.5rem 0.6rem;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      text-align: center;
      border-style: solid;
      border-width: 0.5px;
    }

    .pet-card:hover {
      transform: translateY(-2px);
    }

    .pet-card-canvas-box {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 120px;
      height: 120px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .pet-card-canvas-box canvas {
      image-rendering: pixelated;
      display: block;
      background: #ffffff !important;
      border-radius: 8px;
    }

    .pet-card-name {
      font-size: 0.5rem;
      letter-spacing: 0.03em;
    }

    .pet-card-desc {
      font-size: 0.42rem;
      line-height: 1.9;
      font-family: 'Press Start 2P', monospace;
    }

    /* ── Warning ── */
    .pet-picker-warning {
      font-size: 0.55rem;
      color: #888;
      text-align: center;
      margin: 0.5rem 0 0.75rem;
      line-height: 2.2;
      letter-spacing: 0.02em;
      font-family: 'Press Start 2P', monospace;
    }

    /* ── Buttons ── */
    .picker-confirm-btn {
      display: block;
      width: 100%;
      padding: 0.8rem;
      background: #e8622a;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.1s, transform 0.08s;
      margin-bottom: 0.5rem;
    }

    .picker-confirm-btn:hover  { background: #d05522; }
    .picker-confirm-btn:active { transform: translateY(1px); }

    .picker-cancel-btn {
      display: block;
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.7rem;
      background: none;
      border: 1px solid #333;
      color: #666;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 6px;
      transition: border-color 0.15s, color 0.15s;
    }

    .picker-cancel-btn:hover {
      border-color: #666;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="modal">
    <h3>🐾 Change companion</h3>
    <div class="pet-picker" id="pet-picker"></div>
    <p class="pet-picker-warning">
      Consistency matters — switching companion resets your XP to 0.
    </p>
    <button class="picker-confirm-btn">CONFIRM</button>
    <button class="picker-cancel-btn">CANCEL</button>
  </div>

  <script type="module">
    import { drawPet } from './src/petSprites.js';

    const PETS = [
      { id: 'cat',      name: 'Mochi',  description: 'Sleepy orange tabby',   bg: '#fff5f0', textColor: '#c04010', innerBg: '#ffd8c4' },
      { id: 'dog',      name: 'Max',    description: 'Golden happy pupper',   bg: '#fff8f0', textColor: '#8a6010', innerBg: '#ffe4b8' },
      { id: 'dragon',   name: 'Drakon', description: 'Ancient egg awakens',   bg: '#f0fff8', textColor: '#0a6040', innerBg: '#b0f0d0' },
      { id: 'bunny',    name: 'Pochi',  description: 'Soft lavender bunny',   bg: '#f5f0ff', textColor: '#5a3090', innerBg: '#d8c8ff' },
      { id: 'fox',      name: 'Kira',   description: 'Clever orange fox',     bg: '#fff5f0', textColor: '#a04010', innerBg: '#ffd8b4' },
      { id: 'axolotl',  name: 'Axie',   description: 'Pink wiggly axolotl',   bg: '#fff0f5', textColor: '#a03060', innerBg: '#ffc8dc' },
    ];

    let selectedId = 'cat';
    const picker = document.getElementById('pet-picker');

    function borderColor(pet) {
      const c = pet.textColor;
      const r = parseInt(c.slice(1,3),16);
      const g = parseInt(c.slice(3,5),16);
      const b = parseInt(c.slice(5,7),16);
      return `rgba(${r},${g},${b},0.4)`;
    }

    function render() {
      picker.innerHTML = '';
      PETS.forEach(pet => {
        const selected = pet.id === selectedId;

        const card = document.createElement('button');
        card.className = 'pet-card' + (selected ? ' pet-card-selected' : '');
        card.style.background = pet.bg;
        card.style.borderColor = selected ? pet.textColor : borderColor(pet);
        card.style.borderWidth  = selected ? '2px' : '0.5px';
        card.style.boxShadow    = selected
          ? `0 2px 10px ${borderColor(pet).replace('0.4','0.28')}`
          : '';

        const box = document.createElement('div');
        box.className = 'pet-card-canvas-box';
        box.style.background = '#ffffff';

        const canvas = document.createElement('canvas');
        canvas.width  = 144;
        canvas.height = 144;
        canvas.style.width       = '120px';
        canvas.style.height      = '120px';
        canvas.style.background  = '#ffffff';
        canvas.style.borderRadius = '8px';

        box.appendChild(canvas);

        const nameEl = document.createElement('span');
        nameEl.className = 'pet-card-name';
        nameEl.textContent = pet.name;
        nameEl.style.color = pet.textColor;

        const descEl = document.createElement('span');
        descEl.className = 'pet-card-desc';
        descEl.textContent = pet.description;
        descEl.style.color = pet.textColor;

        card.appendChild(box);
        card.appendChild(nameEl);
        card.appendChild(descEl);

        card.addEventListener('click', () => {
          selectedId = pet.id;
          render();
        });

        picker.appendChild(card);

        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        drawPet(ctx, pet.id, 0, 0, true, '#ffffff');
      });
    }

    render();
  </script>

</body>
</html>
